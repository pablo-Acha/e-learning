name: frontend-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "elearning-frontend/**"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Descargar código
      - uses: actions/checkout@v4
      
      # 1.5. Convertir nombre del repositorio a minúsculas (Docker requiere nombres en minúsculas)
      - name: Set image name in lowercase
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${REPO_OWNER_LOWER}/elearning-frontend" >> $GITHUB_ENV
          echo "Image name set to: ${REPO_OWNER_LOWER}/elearning-frontend"

      # 2. Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login al GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extraer metadatos para Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=-{{sha}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 5. Configurar Node para pruebas
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: elearning-frontend/package-lock.json

      # 6. Instalar dependencias para pruebas
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: elearning-frontend

      # 7. Ejecutar linting (sustituye pruebas ya que no hay script test)
      - name: Run ESLint
        run: npm run lint
        working-directory: elearning-frontend

      # 9. Construir imagen Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./elearning-frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 10. Desplegar a EC2
      - name: Deploy to EC2
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem
          
          # Comando para desplegar la imagen Docker en EC2
          ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << 'REMOTE_SCRIPT'
          set -e
          
          # Instalar Docker si no está instalado
          if ! command -v docker &> /dev/null; then
            echo "Instalando Docker..."
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg lsb-release
            
            # Obtener el código de versión de Ubuntu
            VERSION_CODENAME=$(lsb_release -cs)
            
            # Instalar Docker usando el método oficial
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc
            
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            
            # Agregar usuario al grupo docker (requiere logout/login para tomar efecto)
            sudo usermod -aG docker $USER || true
          fi
          
          # Asegurar que el servicio Docker esté corriendo
          sudo systemctl start docker || true
          sudo systemctl enable docker || true
          
          # Usar sudo para comandos docker (ya que el grupo docker requiere logout)
          DOCKER_CMD="sudo docker"
          
          # Pull de la imagen más reciente
          echo "${{ secrets.GITHUB_TOKEN }}" | $DOCKER_CMD login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          $DOCKER_CMD pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # Detener y remover contenedor anterior si existe
          $DOCKER_CMD stop elearning-frontend || true
          $DOCKER_CMD rm elearning-frontend || true
          
          # Ejecutar nuevo contenedor
          $DOCKER_CMD run -d \
            --name elearning-frontend \
            -p 80:80 \
            --restart unless-stopped \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # Limpiar imágenes antiguas
          $DOCKER_CMD image prune -af
          REMOTE_SCRIPT
          
          rm -f key.pem