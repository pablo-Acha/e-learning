name: frontend-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "elearning-frontend/**"

env:
  REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_USERNAME: "leonardocz"  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      
      - uses: actions/checkout@v4
      
      - name: Set image name in lowercase
        run: |
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${REPO_OWNER_LOWER}/elearning-frontend" >> $GITHUB_ENV
          echo "Image name set to: ${REPO_OWNER_LOWER}/elearning-frontend"
          
          echo "DOCKERHUB_IMAGE_NAME=${{ env.DOCKERHUB_USERNAME }}/elearning-frontend" >> $GITHUB_ENV
          echo "Docker Hub image name: ${{ env.DOCKERHUB_USERNAME }}/elearning-frontend"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=-{{sha}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: elearning-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: elearning-frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: elearning-frontend

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./elearning-frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify images pushed
        run: |
          echo "Imágenes subidas exitosamente a:"
          echo "1. GitHub Container Registry:"
          echo "   - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "   - URL: https://github.com/${{ github.repository_owner }}?tab=packages"
          echo ""
          echo "2. Docker Hub:"
          echo "   - ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}:latest"
          echo "   - URL: https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/elearning-frontend"

      - name: Deploy to EC2
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem
          
          USE_DOCKERHUB="true"
          
          if [ "$USE_DOCKERHUB" = "true" ]; then
            REGISTRY_TO_USE="${{ env.DOCKERHUB_REGISTRY }}"
            IMAGE_TO_USE="${{ env.DOCKERHUB_IMAGE_NAME }}"
            LOGIN_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            LOGIN_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
            echo "Usando Docker Hub para despliegue"
          else
            REGISTRY_TO_USE="${{ env.REGISTRY }}"
            IMAGE_TO_USE="${{ env.IMAGE_NAME }}"
            LOGIN_USER="${{ github.actor }}"
            LOGIN_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            echo "Usando GitHub Container Registry para despliegue"
          fi
          
          ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << EOF
          set -e
          
          if ! command -v docker &> /dev/null; then
            echo "Instalando Docker..."
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg lsb-release
            
            VERSION_CODENAME=\$(lsb_release -cs)
            
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc
            
            echo "deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \${VERSION_CODENAME} stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            
            sudo usermod -aG docker \$USER || true
          fi
          
          sudo systemctl start docker || true
          sudo systemctl enable docker || true
          
          DOCKER_CMD="sudo docker"
          
          if [ "$REGISTRY_TO_USE" = "docker.io" ]; then
            # Para Docker Hub
            echo "{\\"auths\\":{\\"https://index.docker.io/v1/\\":{\\"username\\":\\"$LOGIN_USER\\",\\"password\\":\\"$LOGIN_TOKEN\\"}}}" | sudo tee /root/.docker/config.json > /dev/null
          else
            # Para GHCR
            echo "{\\"auths\\":{\\"$REGISTRY_TO_USE\\":{\\"username\\":\\"$LOGIN_USER\\",\\"password\\":\\"$LOGIN_TOKEN\\"}}}" | sudo tee /root/.docker/config.json > /dev/null
          fi
          
          sudo chmod 600 /root/.docker/config.json
          \$DOCKER_CMD rmi -f $REGISTRY_TO_USE/$IMAGE_TO_USE:latest || true
          \$DOCKER_CMD pull $REGISTRY_TO_USE/$IMAGE_TO_USE:latest
          
          \$DOCKER_CMD stop elearning-frontend 2>/dev/null || true
          \$DOCKER_CMD rm -f elearning-frontend 2>/dev/null || true
          
          PORT_80_CONTAINER=\$(\$DOCKER_CMD ps -q --filter "publish=80")
          if [ ! -z "\$PORT_80_CONTAINER" ]; then
            echo "Deteniendo contenedor que usa el puerto 80: \$PORT_80_CONTAINER"
            \$DOCKER_CMD stop \$PORT_80_CONTAINER 2>/dev/null || true
            \$DOCKER_CMD rm -f \$PORT_80_CONTAINER 2>/dev/null || true
          fi
          
          sleep 2
          
          \$DOCKER_CMD run -d \
            --name elearning-frontend \
            -p 80:80 \
            --restart unless-stopped \
            $REGISTRY_TO_USE/$IMAGE_TO_USE:latest
          
          \$DOCKER_CMD image prune -af
          
          echo "Despliegue completado desde: $REGISTRY_TO_USE"
          echo "Imagen: $REGISTRY_TO_USE/$IMAGE_TO_USE:latest"
          EOF
          
          rm -f key.pem