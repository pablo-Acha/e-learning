name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER_PABLO }}
          password: ${{ secrets.DOCKERHUB_TOKEN_PABLO }}

      - name: Build and tag Docker image
        run: |
          docker build -t pabloacha2/backend:latest ./backend
          docker tag pabloacha2/backend:latest pabloacha2/backend:${{ github.sha }}

      - name: Push images to DockerHub
        run: |
          docker push pabloacha2/backend:latest
          docker push pabloacha2/backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST_BACK }}
          username: ${{ secrets.EC2_USER_BACK }}
          key: ${{ secrets.EC2_KEY_BACK }}
          script: |
            docker pull pabloacha2/backend:latest

            mkdir -p /var/www/estudy-backend

            cat <<EOF > /var/www/estudy-backend/.env
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            PORT=${{ secrets.PORT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            EOF

            docker stop backend || true
            docker rm backend || true

            docker run -d --name backend --restart always \
              --env-file /var/www/estudy-backend/.env \
              -p 4000:4000 \
              pabloacha2/backend:latest
