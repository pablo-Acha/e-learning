name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER_PABLO }}
          password: ${{ secrets.DOCKERHUB_TOKEN_PABLO }}

      - name: Build and tag Docker image
        run: |
          # Tag principal: latest
          docker build -t pabloacha2/backend:latest ./backend
          # Tag único por commit SHA
          docker tag pabloacha2/backend:latest pabloacha2/backend:${{ github.sha }}

      - name: Push images to DockerHub
        run: |
          docker push pabloacha2/backend:latest
          docker push pabloacha2/backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST_BACK }}
          username: ${{ secrets.EC2_USER_BACK }}
          key: ${{ secrets.EC2_KEY_BACK }}
          script: |
            
            IMAGE_TAG=${{ github.sha }}

            echo "Pulling image pabloacha2/backend:$IMAGE_TAG"
            docker pull pabloacha2/backend:$IMAGE_TAG

            mkdir -p /var/www/estudy-backend

            cat <<EOF > /var/www/estudy-backend/.env
            # DATABASE
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}

            # SERVER
            PORT=${{ secrets.PORT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}

            # AWS
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}
            EOF

            # Detener y eliminar contenedor anterior
            docker stop backend || true
            docker rm backend || true

            # Levantar contenedor nuevo con la imagen del SHA
            docker run -d --name backend --restart always \
              --env-file /var/www/estudy-backend/.env \
              -p 4000:4000 \
              pabloacha2/backend:$IMAGE_TAG
